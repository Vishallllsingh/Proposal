<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Heart's Confession</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle, #ffe3e3, #ffc2d1);
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #fff;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #880e4f;
      text-shadow: 2px 2px #fff;
      animation: fadeIn 2s ease-out;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #4a0033;
      animation: fadeIn 3s ease-out;
    }
    .photo-frame {
      display: flex;
      gap: 50px;
      margin: 20px 0;
      justify-content: center;
    }
    .photo-frame img {
      width: 200px;
      height: 260px;
      border-radius: 20px;
      border: 5px solid #fff;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }
    .photo-frame img:hover {
      transform: scale(1.05);
    }
    .btn {
      padding: 15px 40px;
      font-size: 1.3rem;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      border: none;
      color: white;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(255, 0, 102, 0.4);
      transition: all 0.3s;
      animation: buttonBounce 1s ease-out infinite;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .msg {
      margin-top: 30px;
      font-size: 1.5rem;
      color: #d50000;
      display: none;
      animation: popin 1s ease forwards;
    }

    @keyframes popin {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes buttonBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .floating-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 2rem;
      animation: floatHearts 4s linear infinite;
      opacity: 0;
    }
    @keyframes floatHearts {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
        padding: 0 10px;
      }
      .photo-frame {
        flex-direction: column;
        gap: 20px;
      }
      .photo-frame img {
        width: 90%;
        height: auto;
      }
      .btn {
        width: 90%;
        font-size: 1.1rem;
        padding: 12px 30px;
      }
      .msg {
        font-size: 1.2rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <audio id="music" autoplay loop>
    <source src="romantic_background_music.mp3" type="audio/mp3">
  </audio>

  <div class="container">
    <h1>My Heart's Confession ❤️</h1>
    <p>From the moment I saw you, I knew you were special. Today, I gather courage to ask you something from the bottom of my heart.</p>
    <div class="photo-frame">
      <img src="AGndduu.jpg" alt="Me">
      <img src="gan2.jpg" alt="You">
    </div>
    <button class="btn" onclick="proposeLove()">Will you be mine?</button>
    <div class="msg" id="response">You just made me the happiest person alive! 💍</div>
  </div>

  <div class="floating-hearts" id="hearts"></div>

  <script>
    function proposeLove() {
      const response = document.getElementById('response');
      response.style.display = 'block';

      for (let i = 0; i < 40; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 1.5 + 1 + 'rem';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        heart.style.animationDelay = (Math.random() * 2) + 's';
        document.getElementById('hearts').appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }
    }

    // Allow music to play on first user interaction (for mobile)
    document.addEventListener('click', () => {
      const music = document.getElementById('music');
      if (music.paused) {
        music.play();
      }
    }, { once: true });
  </script>
</body>
</html>
